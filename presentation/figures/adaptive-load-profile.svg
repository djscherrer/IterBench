<svg width="1100" height="620" viewBox="0 0 1100 620" style="display:block"><defs /><rect x="0" y="0" width="1100" height="620" fill="#ffffff" /><svg x="40" y="14" width="16" height="16" viewBox="0 -960 960 960"><path d="M640-160v-280h160v280H640Zm-240 0v-640h160v640H400Zm-240 0v-440h160v440H160Z" fill="#7c3aed" /></svg><text x="62" y="26" fill="#5b21b6" font-size="10" font-weight="700" letter-spacing="0.06em" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">BENCH · ADAPTIVE LOAD PROFILE</text><text x="550" y="45" text-anchor="middle" fill="#111827" font-size="15" font-weight="700" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Adaptive load profile and sustained-goodput measurement</text><text x="550" y="63" text-anchor="middle" fill="#6b7280" font-size="9.5" font-style="italic" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">warm-up (health gate) → explore → recovery → refine → sustained goodput</text><path stroke="#9ca3af" stroke-width="1.6" d="M 220 182 L 250 182" /><path fill="#9ca3af" d="M 0 0 L 7 2.5 L 0 5 Z" transform="translate(250 182) rotate(0) scale(1.6) translate(-6 -2.5)" /><path stroke="#9ca3af" stroke-width="1.6" d="M 430 182 L 460 182" /><path fill="#9ca3af" d="M 0 0 L 7 2.5 L 0 5 Z" transform="translate(460 182) rotate(0) scale(1.6) translate(-6 -2.5)" /><path stroke="#9ca3af" stroke-width="1.6" d="M 640 182 L 670 182" /><path fill="#9ca3af" d="M 0 0 L 7 2.5 L 0 5 Z" transform="translate(670 182) rotate(0) scale(1.6) translate(-6 -2.5)" /><path stroke="#9ca3af" stroke-width="1.6" d="M 850 182 L 880 182" /><path fill="#9ca3af" d="M 0 0 L 7 2.5 L 0 5 Z" transform="translate(880 182) rotate(0) scale(1.6) translate(-6 -2.5)" /><rect x="40" y="80" width="180" height="204" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8" /><text x="54" y="104" fill="#5b21b6" font-size="13.5" font-weight="700" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Warm-up</text><text x="54" y="128" fill="#374151" font-size="11" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Fixed initial user count</text><text x="54" y="150" fill="#374151" font-size="11" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Hold for 30 s</text><text x="54" y="172" fill="#374151" font-size="11" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Health gate: active users</text><text x="54" y="194" fill="#374151" font-size="11" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">and requests observed</text><text x="54" y="216" fill="#374151" font-size="11" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Failure rate below threshold</text><rect x="250" y="80" width="180" height="204" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8" /><text x="264" y="104" fill="#5b21b6" font-size="13.5" font-weight="700" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Explore</text><text x="264" y="126" fill="#374151" font-size="9.5" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Ramp virtual users upward</text><text x="264" y="139" fill="#374151" font-size="9.5" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">≈4% increments (min 20)</text><text x="264" y="152" fill="#374151" font-size="9.5" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">p95-adaptive spacing</text><text x="264" y="165" fill="#374151" font-size="9.5" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Track best rolling goodput</text><text x="264" y="180" fill="#9ca3af" font-size="7.5" font-weight="700" letter-spacing="0.05em" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">STOPS WHEN</text><rect x="264" y="186" width="152" height="13" rx="6.5" fill="#fef2f2" stroke="#dc2626" stroke-width="1" /><text x="340" y="195.5" text-anchor="middle" fill="#991b1b" font-size="7.8" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">fail rate &gt; 2%</text><rect x="264" y="202" width="152" height="13" rx="6.5" fill="#fef2f2" stroke="#dc2626" stroke-width="1" /><text x="340" y="211.5" text-anchor="middle" fill="#991b1b" font-size="7.8" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">p95 latency &gt; 1000 ms</text><rect x="264" y="218" width="152" height="13" rx="6.5" fill="#fef2f2" stroke="#dc2626" stroke-width="1" /><text x="340" y="227.5" text-anchor="middle" fill="#991b1b" font-size="7.8" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">goodput &lt; 95% of best ×3</text><rect x="264" y="234" width="152" height="13" rx="6.5" fill="#fef2f2" stroke="#dc2626" stroke-width="1" /><text x="340" y="243.5" text-anchor="middle" fill="#991b1b" font-size="7.8" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">user ceiling reached</text><text x="264" y="263" fill="#5b21b6" font-size="8.3" font-style="italic" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">find the overload boundary —</text><text x="264" y="275" fill="#5b21b6" font-size="8.3" font-style="italic" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">not the final score</text><rect x="460" y="80" width="180" height="204" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8" /><text x="474" y="104" fill="#5b21b6" font-size="13.5" font-weight="700" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Recovery</text><text x="474" y="130" fill="#374151" font-size="11.5" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Drop to 75% of explore peak</text><text x="474" y="158" fill="#374151" font-size="11.5" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Hold for 45 s</text><text x="474" y="186" fill="#374151" font-size="11.5" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">−15% more if unhealthy</text><text x="474" y="214" fill="#374151" font-size="11.5" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Up to 3 attempts total</text><rect x="670" y="80" width="180" height="204" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8" /><text x="684" y="104" fill="#5b21b6" font-size="13.5" font-weight="700" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Refine</text><text x="684" y="126" fill="#374151" font-size="9" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Search upward from recovery</text><text x="684" y="139" fill="#374151" font-size="9" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Efficiency-scaled increments</text><text x="684" y="152" fill="#374151" font-size="9" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Cap: 5% of recovery-entry users</text><text x="684" y="165" fill="#374151" font-size="9" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Accept after 10 stable 1 s samples</text><text x="684" y="178" fill="#374151" font-size="9" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Stop: stall, fail rate, or ceiling</text><text x="684" y="263" fill="#5b21b6" font-size="8.3" font-style="italic" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">best settled refine level =</text><text x="684" y="275" fill="#5b21b6" font-size="8.3" font-style="italic" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">sustained goodput</text><rect x="880" y="80" width="180" height="204" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.2" /><text x="894" y="101" fill="#4c1d95" font-size="13" font-weight="700" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Sustained goodput</text><rect x="894" y="108" width="112" height="14" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1" /><text x="950" y="117.5" text-anchor="middle" fill="#4c1d95" font-size="7" font-weight="700" letter-spacing="0.05em" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">PRIMARY METRIC</text><text x="894" y="137" fill="#374151" font-size="9.3" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">= best settled refine level</text><text x="894" y="150" fill="#374151" font-size="9.3" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">primary cross-iteration score</text><text x="894" y="163" fill="#374151" font-size="9.3" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Low goodput is a valid result</text><text x="894" y="176" fill="#374151" font-size="9.3" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Harness failure is recorded</text><text x="894" y="189" fill="#374151" font-size="9.3" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">separately (not a scored run)</text><path stroke="#dc2626" stroke-width="1.6" d="M 130 284 L 130 300" /><path fill="#dc2626" d="M 0 0 L 7 2.5 L 0 5 Z" transform="translate(130 300) rotate(90) scale(1.6) translate(-6 -2.5)" /><rect x="45" y="300" width="170" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" /><text x="130" y="316" text-anchor="middle" fill="#991b1b" font-size="8.6" font-weight="700" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">health check fails →</text><text x="130" y="330" text-anchor="middle" fill="#991b1b" font-size="8.6" font-weight="700" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">stop; sustained goodput = 0</text><path stroke="#dc2626" stroke-width="1.6" d="M 550 284 L 550 300" /><path fill="#dc2626" d="M 0 0 L 7 2.5 L 0 5 Z" transform="translate(550 300) rotate(90) scale(1.6) translate(-6 -2.5)" /><rect x="450" y="300" width="200" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" /><text x="550" y="316" text-anchor="middle" fill="#991b1b" font-size="8.6" font-weight="700" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">recovery fails → stop before refine;</text><text x="550" y="330" text-anchor="middle" fill="#991b1b" font-size="8.6" font-weight="700" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">sustained goodput = 0</text><rect x="40" y="354" width="1020" height="248" rx="10" fill="#fafbfc" stroke="#e5e7eb" stroke-width="1.3" /><text x="56" y="372" fill="#6b7280" font-size="9.5" font-style="italic" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Illustrative trace (conceptual — not measured data)</text><rect x="904" y="360" width="146" height="64" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" /><line x1="914" y1="373" x2="930" y2="373" stroke="#64748b" stroke-width="2.5" /><text x="935" y="376" fill="#374151" font-size="8" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">offered users</text><line x1="914" y1="387" x2="930" y2="387" stroke="#7c3aed" stroke-width="2.5" /><text x="935" y="390" fill="#374151" font-size="8" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">goodput (successful)</text><circle cx="922" cy="401" r="3" fill="#dc2626" /><text x="935" y="404" fill="#374151" font-size="8" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">overload / stop event</text><circle cx="922" cy="415" r="3" fill="#16a34a" /><text x="935" y="418" fill="#374151" font-size="8" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">best settled (sustained)</text><line x1="158.6" y1="414" x2="158.6" y2="566" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3" /><line x1="522.1" y1="414" x2="522.1" y2="566" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3" /><line x1="652.9" y1="414" x2="652.9" y2="566" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3" /><text x="135" y="407" text-anchor="middle" fill="#9ca3af" font-size="8" font-weight="700" letter-spacing="0.04em" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">WARM-UP</text><text x="340" y="407" text-anchor="middle" fill="#9ca3af" font-size="8" font-weight="700" letter-spacing="0.04em" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">EXPLORE</text><text x="587" y="407" text-anchor="middle" fill="#9ca3af" font-size="8" font-weight="700" letter-spacing="0.04em" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">RECOVERY</text><text x="848" y="407" text-anchor="middle" fill="#9ca3af" font-size="8" font-weight="700" letter-spacing="0.04em" font-fam