e="8.3" font-style="italic" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">be transient</text><line x1="522.1" y1="490" x2="522.1" y2="512" stroke="#166534" stroke-width="1" stroke-dasharray="2 2" /><text x="480" y="524" fill="#166534" font-size="8.3" font-style="italic" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">recovery re-enters</text><text x="480" y="535" fill="#166534" font-size="8.3" font-style="italic" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">a healthy region</text><line x1="978.8" y1="451.9" x2="960" y2="437" stroke="#166534" stroke-width="1" stroke-dasharray="2 2" /><text x="748" y="425" fill="#166534" font-size="8.3" font-style="italic" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">sustained score comes from</text><text x="748" y="436" fill="#166534" font-size="8.3" font-style="italic" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">the best settled refine level</text></svg>