<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="780" height="470" viewBox="0 0 780 470">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#64748b" />
    </marker>
    <marker id="a-rev" markerWidth="7" markerHeight="5" refX="1" refY="2.5" orient="auto">
      <polygon points="7 0, 0 2.5, 7 5" fill="#64748b" />
    </marker>
    <marker id="a-orange" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#ea580c" />
    </marker>
    <marker id="a-blue-sched" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <marker id="a-purple" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#7c3aed" />
    </marker>
    <marker id="a-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d9488" />
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="470" fill="#ffffff" />

  <!-- External LLM cloud -->
  <g transform="translate(54, 8)">
    <path
      d="M 36 48
         C 12 48, 8 28, 28 22
         C 30 8, 54 4, 64 16
         C 74 4, 108 6, 112 22
         C 136 24, 138 48, 112 48
         Z"
      fill="#fffbeb"
      stroke="#d97706"
      stroke-width="1.6"
      stroke-dasharray="5 3"
    />
    <text x="72" y="36" text-anchor="middle" dominant-baseline="middle"
          fill="#92400e" font-size="12" font-weight="700" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">External LLM</text>
  </g>

  <!-- Kubernetes frame -->
  <rect x="48" y="100" width="700" height="180" rx="12"
        fill="#fafbfc" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" />
  <text x="64" y="120" fill="#64748b" font-size="10" font-weight="700"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.1em">KUBERNETES</text>

  <!-- Control host -->
  <rect x="64" y="132" width="250" height="132" rx="10"
        fill="#f8fafc" stroke="#475569" stroke-width="1.5" />
  <text x="189" y="150" text-anchor="middle" fill="#475569" font-size="9" font-weight="700"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.08em">CONTROL HOST</text>

  <!-- Orchestrator -->
  <rect x="76" y="160" width="100" height="90" rx="6"
        fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4" />
  <text x="126" y="192" text-anchor="middle" fill="#115e59" font-size="11" font-weight="700"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">FlexBench</text>
  <text x="126" y="210" text-anchor="middle" fill="#115e59" font-size="11" font-weight="700"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Orchestrator</text>

  <!-- Orchestrator -> LLM -->
  <line x1="126" y1="160" x2="126" y2="56" stroke="#0d9488" stroke-width="1.7" marker-end="url(#a-teal)" />
  <text x="138" y="78" fill="#115e59" font-size="9" font-style="italic"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Prompt LLM</text>

  <!-- Control plane -->
  <rect x="188" y="160" width="112" height="40" rx="5"
        fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" />
  <text x="244" y="180" text-anchor="middle" dominant-baseline="middle" fill="#1e3a8a"
        font-size="10" font-weight="700" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Control plane</text>

  <!-- Registry -->
  <rect x="188" y="210" width="112" height="40" rx="5"
        fill="#fff7ed" stroke="#ea580c" stroke-width="1.4" />
  <text x="244" y="230" text-anchor="middle" dominant-baseline="middle" fill="#9a3412"
        font-size="10" font-weight="700" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Registry</text>

  <!-- schedules pods -->
  <line x1="300" y1="180" x2="504" y2="180" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue-sched)" />
  <text x="400" y="170" text-anchor="middle" fill="#1e3a8a" font-size="9" font-style="italic"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">schedules pods</text>

  <!-- image pull -->
  <line x1="504" y1="230" x2="300" y2="230" stroke="#ea580c" stroke-width="1.4" marker-end="url(#a-orange)" />
  <text x="400" y="246" text-anchor="middle" fill="#9a3412" font-size="8.5" font-style="italic"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">image pull</text>

  <!-- Worker stack -->
  <text x="589" y="134" text-anchor="middle" fill="#14532d" font-size="9" font-weight="700"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.08em">WORKER NODES</text>
  <rect x="524" y="144" width="170" height="110" rx="8" fill="#e7f8ed" stroke="#16a34a" stroke-width="1.2" opacity="0.5" />
  <rect x="514" y="154" width="170" height="110" rx="8" fill="#dff5e7" stroke="#16a34a" stroke-width="1.3" opacity="0.75" />
  <rect x="504" y="164" width="170" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.7" />
  <text x="589" y="188" text-anchor="middle" fill="#14532d" font-size="12" font-weight="700"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Workers</text>

  <!-- worker slots: backend / DB / cache -->
  <g>
    <rect x="516" y="206" width="52" height="28" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2" />
    <text x="542" y="220" text-anchor="middle" dominant-baseline="middle" fill="#14532d"
          font-size="9" font-weight="600" font-family="'JetBrains Mono', 'Courier New', monospace">backend</text>
  </g>
  <g>
    <rect x="574" y="206" width="36" height="28" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2" />
    <text x="592" y="220" text-anchor="middle" dominant-baseline="middle" fill="#14532d"
          font-size="9" font-weight="600" font-family="'JetBrains Mono', 'Courier New', monospace">DB</text>
  </g>
  <g>
    <rect x="616" y="206" width="46" height="28" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2" />
    <text x="639" y="220" text-anchor="middle" dominant-baseline="middle" fill="#14532d"
          font-size="9" font-weight="600" font-family="'JetBrains Mono', 'Courier New', monospace">cache</text>
  </g>

  <!-- Locust frame -->
  <rect x="48" y="320" width="700" height="128" rx="10"
        fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="64" y="340" fill="#5b21b6" font-size="10" font-weight="700"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.08em">LOCUST</text>

  <!-- Locust master -->
  <rect x="100" y="356" width="150" height="64" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="175" y="388" text-anchor="middle" dominant-baseline="middle" fill="#5b21b6"
        font-size="12" font-weight="700" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Locust master</text>

  <!-- Orchestrator -> Locust master -->
  <line x1="126" y1="250" x2="126" y2="356" stroke="#0d9488" stroke-width="1.8" marker-end="url(#a-teal)" />
  <text x="138" y="300" fill="#115e59" font-size="9" font-style="italic"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">run load test</text>

  <!-- Locust master -> workers -->
  <line x1="250" y1="388" x2="464" y2="388" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a-purple)" />
  <text x="350" y="378" text-anchor="middle" fill="#5b21b6" font-size="9" font-style="italic"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">coordinate load</text>

  <text x="550" y="352" text-anchor="middle" fill="#5b21b6" font-size="8.5" font-weight="700"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.06em">LOCUST WORKERS</text>
  <rect x="484" y="360" width="150" height="56" rx="7" fill="#efe8ff" stroke="#7c3aed" stroke-width="1.1" opacity="0.5" />
  <rect x="474" y="368" width="150" height="56" rx="7" fill="#e9e0ff" stroke="#7c3aed" stroke-width="1.2" opacity="0.75" />
  <rect x="464" y="376" width="150" height="56" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="539" y="404" text-anchor="middle" dominant-baseline="middle" fill="#5b21b6"
        font-size="12" font-weight="700" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Workers</text>

  <!-- HTTP load fan -->
  <path d="M 490 376 L 490 312 L 520 312 L 520 274" fill="none" stroke="#7c3aed" stroke-width="1.1" opacity="0.45" />
  <path d="M 512 376 L 512 312 L 542 312 L 542 274" fill="none" stroke="#7c3aed" stroke-width="1.1" opacity="0.55" />
  <path d="M 534 376 L 534 312 L 564 312 L 564 274" fill="none" stroke="#7c3aed" stroke-width="1.1" opacity="0.65" marker-end="url(#a-purple)" />
  <path d="M 556 376 L 556 312 L 586 312 L 586 274" fill="none" stroke="#7c3aed" stroke-width="1.1" opacity="0.75" />
  <path d="M 578 376 L 578 312 L 608 312 L 608 274" fill="none" stroke="#7c3aed" stroke-width="1.1" opacity="0.85" />
  <text x="640" y="308" fill="#5b21b6" font-size="9" font-style="italic"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">HTTP load (NodePort)</text>
</svg>
