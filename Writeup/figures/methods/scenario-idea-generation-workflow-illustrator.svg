  </defs>

  <rect x="120" y="130" width="1480" height="650" fill="#ffffff"/>

  <!-- Build stages: scenario generation precedes API-specification generation. -->
  <g id="workflow-stages">
    <rect x="190" y="170" width="460" height="170" rx="14" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
    <rect x="990" y="170" width="420" height="170" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="420" y="263" text-anchor="middle" class="stage-title" fill="#a14f06">1  Scenario generation</text>
  <text x="1200" y="263" text-anchor="middle" class="stage-title" fill="#1e3a8a">2  API contract generation</text>

  <!-- A plain stage-to-author prompt starts the scenario-author conversation. -->
  <path d="M320 340 V500" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#arrow-yellow)"/>

  <!-- The novelty verifier also receives the existing scenario set. -->
  <use xlink:href="#document-mark" transform="translate(744 382) scale(.032)" fill="#64748b"/>
  <use xlink:href="#document-mark" transform="translate(753 382) scale(.032)" fill="#64748b" opacity=".72"/>
  <use xlink:href="#document-mark" transform="translate(762 382) scale(.032)" fill="#64748b" opacity=".48"/>
  <text x="805" y="408" class="tiny" fill="#475569">existing scenarios</text>
  <path d="M765 430 V500" fill="none" stroke="#7c3aed" stroke-width="2.3" marker-end="url(#arrow-purple)"/>

  <!-- The author proposes an idea directly to the independent novelty verifier. -->
  <path d="M430 570 L700 570" fill="none" stroke="#fbbf24" stroke-width="2.6" marker-end="url(#arrow-yellow)"/>
  <rect x="534" y="553" width="62" height="34" rx="7" fill="#ffffff"/>
  <use xlink:href="#idea-mark" transform="translate(552 556) scale(.036)" fill="#fbbf24"/>
  <text x="565" y="545" text-anchor="middle" class="tiny" fill="#a14f06">scenario idea</text>

  <!-- One clean, elevated verdict return; green acceptance or a red failure record is returned. -->
  <path d="M700 610 H430" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="500" y="593" width="130" height="34" rx="7" fill="#ffffff"/>
  <use xlink:href="#idea-mark" transform="translate(510 596) scale(.034)" fill="#16a34a"/>
  <text x="555" y="615" text-anchor="middle" class="tiny" fill="#475569">or</text>
  <use xlink:href="#failure-record-mark" transform="translate(588 596) scale(.034)" fill="#dc2626"/>

  <!-- An accepted idea is released upward from the author into the generation stage. -->
  <path d="M380 500 L380 340" fill="none" stroke="#16a34a" stroke-width="2.7" marker-end="url(#arrow-green)"/>
  <rect x="356" y="407" width="48" height="34" rx="7" fill="#ffffff"/>
  <use xlink:href="#idea-mark" transform="translate(368 410) scale(.034)" fill="#16a34a"/>

  <!-- The accepted scenario idea is the only artifact passed between the two build stages. -->
  <path d="M650 255 L990 255" fill="none" stroke="#fbbf24" stroke-width="2.7" marker-end="url(#arrow-yellow)"/>
  <rect x="792" y="238" width="62" height="34" rx="7" fill="#ffffff"/>
  <use xlink:href="#idea-mark" transform="translate(810 241) scale(.036)" fill="#fbbf24"/>

  <!-- The API author receives the accepted idea or a repairable failure record and returns the API contract. -->
  <path d="M1110 340 L1110 500" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <rect x="1086" y="403" width="48" height="34" rx="7" fill="#ffffff"/>
  <use xlink:href="#idea-mark" transform="translate(1098 406) scale(.034)" fill="#fbbf24"/>

  <path d="M1160 340 L1160 500" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="1136" y="403" width="48" height="34" rx="7" fill="#ffffff"/>
  <use xlink:href="#failure-record-mark" transform="translate(1148 406) scale(.034)" fill="#dc2626"/>

  <path d="M1210 500 L1210 340" fill="none" stroke="#2563eb" stroke-width="2.7" marker-end="url(#arrow-blue)"/>
  <rect x="1178" y="403" width="64" height="34" rx="7" fill="#ffffff"/>
  <use xlink:href="#api-mark" transform="translate(1187 411) scale(.11)" fill="#2563eb"/>

  <!-- Final scenario artifact: scenario idea plus validated API contract. -->
  <path d="M1410 255 L1530 255" fill="none" stroke="#2563eb" stroke-width="2.7" marker-end="url(#arrow-blue)"/>
  <rect x="1440" y="238" width="88" height="34" rx="7" fill="#ffffff"/>
  <use xlink:href="#idea-mark" transform="translate(1448 242) scale(.032)" fill="#fbbf24"/>
  <use xlink:href="#api-mark" transform="translate(1478 247) scale(.095)" fill="#2563eb"/>
  <text x="1484" y="306" text-anchor="middle" class="tiny" fill="#1e3a8a">validated API contract</text>

  <!-- Continuing author conversations. -->
  <use xlink:href="#llm-agent-mark" transform="translate(270 500) scale(.18)" fill="#f59e0b"/>
  <use xlink:href="#conversation-mark" transform="translate(374 500) scale(.065)" fill="#f59e0b"/>
  <text x="345" y="700" text-anchor="middle" class="agent-title" fill="#a14f06">Scenario author</text>

  <use xlink:href="#llm-agent-mark" transform="translate(690 500) scale(.18)" fill="#7c3aed"/>
  <text x="765" y="700" text-anchor="middle" class="agent-title" fill="#5b21b6">Novelty verifier</text>

  <use xlink:href="#llm-agent-mark" transform="translate(1085 500) scale(.18)" fill="#2563eb"/>
  <use xlink:href="#conversation-mark" transform="translate(1189 500) scale(.065)" fill="#2563eb"/>
  <text x="1160" y="700" text-anchor="middle" class="agent-title" fill="#1e3a8a">API author</text>
</svg>
