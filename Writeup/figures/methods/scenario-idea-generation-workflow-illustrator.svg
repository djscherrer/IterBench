      <path d="M513.33,486.16c-.85,5.73-5.81,9.85-11.49,10.49-5.3.6-22.89.76-27.74-.23-3.19-.65-7.77-4.17-8.51-7.47l-.26-160.68c-.27-5.8,5.27-9.83,10.51-10.47,7.15-.86,25.77-.79,32.99.02,2.6.29,6.01,1.26,8.01,2.98l43.93,82.94,42.94-80.94c2.31-2.74,4.45-4.37,8.1-4.88,6.22-.89,31.62-.87,37.19.58,3.55.93,5.8,3.44,7.38,6.6l.56,162.83c-1.81,6.3-6.03,8.21-12.22,8.76-5.61.5-21.72.76-26.79-.27-3.01-.61-8.72-5.41-8.72-8.26v-72.43l-38.13,72.26c-5.08,8.2-16.45,7.94-20.61-1.03l-37.17-70.23v69.43Z"/>
      <path d="M368.48,451.7h65.94v38.46c0,5.44-6.58,9.07-11.44,9.54-29.31,2.84-63.18-2.24-92.98-.03-3.84-.18-6.92-3.16-8.54-6.44l-.69-166.68c1.04-3.93,4.06-6.94,7.93-8.05,4.5-1.29,25.15-1.34,30.07-.44,3.27.59,9.72,4.95,9.72,8.26v125.38Z"/>
      <path d="M224.62,451.7h64.94v40.46c0,3.4-6.97,7.22-10.44,7.54-29.49,2.7-63.05-2.13-92.98-.02-3.84-.18-6.92-3.16-8.54-6.44l-.69-166.68c1.04-3.93,4.06-6.94,7.93-8.05,4.5-1.29,25.15-1.34,30.07-.44,3.27.59,9.72,4.95,9.72,8.26v125.38Z"/>
    </g>
    <g id="idea-mark"><path d="M423.5-103.5Q400-127 400-160h160q0 33-23.5 56.5T480-80q-33 0-56.5-23.5ZM320-200v-80h320v80H320Zm10-120q-69-41-109.5-110T180-580q0-125 87.5-212.5T480-880q125 0 212.5 87.5T780-580q0 81-40.5 150T630-320H330Zm24-80h252q45-32 69.5-79T700-580q0-92-64-156t-156-64q-92 0-156 64t-64 156q0 54 24.5 101t69.5 79Zm126 0Z" transform="translate(0,960)"/></g>
    <g id="duplicate-mark"><path d="M423.5-103.5Q400-127 400-160h160q0 33-23.5 56.5T480-80q-33 0-56.5-23.5ZM480-800q-44 0-81.5 15.5T332-742l-58-56q41-38 93.5-60T480-880q125 0 212.5 87.5T780-580q0 71-25 121.5T698-376l-56-56q21-23 39.5-59t18.5-89q0-92-64-156t-156-64Zm368 688-57 57-265-265H330q-69-41-109.5-110T180-580q0-20 2.5-39t7.5-37L56-792l56-56 736 736ZM354-400h92L260-586v6q0 54 24.5 101t69.5 79Zm-6-98Zm134-94Zm164 312v80H320v-80h326Z" transform="translate(0,960)"/></g>
    <g id="failure-record-mark"><path d="M480-280q17 0 28.5-11.5T520-320q0-17-11.5-28.5T480-360q-17 0-28.5 11.5T440-320q0 17 11.5 28.5T480-280Zm-40-160h80v-240h-80v240ZM330-120 120-330v-300l210-210h300l210 210v300L630-120H330Zm34-80h232l164-164v-232L596-760H364L200-596v232l164 164Zm116-280Z" transform="translate(0,960)"/></g>
    <g id="document-mark"><path d="M280-80q-33 0-56.5-23.5T200-160v-640q0-33 23.5-56.5T280-880h247q16 0 30.5 6t25.5 17l154 154q11 11 17 25.5t6 30.5v487q0 33-23.5 56.5T680-80H280Zm160-720H280v640h400v-400H560q-50 0-85-35t-35-85v-120Zm80 0v120q0 17 11.5 28.5T560-640h120v-7L527-800h-7ZM400-200q-17 0-28.5-11.5T360-240q0-17 11.5-28.5T400-280h80q17 0 28.5 11.5T520-240q0 17-11.5 28.5T480-200h-80Zm0-160q-17 0-28.5-11.5T360-400q0-17 11.5-28.5T400-440h160q17 0 28.5 11.5T600-400q0 17-11.5 28.5T560-360H400Z" transform="translate(0,960)"/></g>
    <g id="document-mark"><path d="M280-80q-33 0-56.5-23.5T200-160v-640q0-33 23.5-56.5T280-880h247q16 0 30.5 6t25.5 17l154 154q11 11 17 25.5t6 30.5v487q0 33-23.5 56.5T680-80H280Zm160-720H280v640h400v-400H560q-50 0-85-35t-35-85v-120Zm80 0v120q0 17 11.5 28.5T560-640h120v-7L527-800h-7ZM400-200q-17 0-28.5-11.5T360-240q0-17 11.5-28.5T400-280h80q17 0 28.5 11.5T520-240q0 17-11.5 28.5T480-200h-80Zm0-160q-17 0-28.5-11.5T360-400q0-17 11.5-28.5T400-440h160q17 0 28.5 11.5T600-400q0 17-11.5 28.5T560-360H400Z" transform="translate(0,960)"/></g>
    <g id="api-mark"><path d="M97.4 139.6 87.4 106.4H40.8l-10 33.2H0L46 0h37.6L129 139.6H97.4ZM64.4 27.6h-1L48 80.6h32l-15.6-53ZM150.4 139.6V0h66c26 0 42.4 18.2 42.4 44.6S242.4 89.2 216.4 89.2h-35.6v50.4h-30.4Zm30.4-76.8h32c9 0 14.6-4.8 14.6-13.8v-8.8c0-9-5.6-13.8-14.6-13.8h-32v36.4ZM278.2 139.6v-24.2h18V24.2h-18V0h66.4v24.2h-18v91.2h18v24.2h-66.4Z"/></g>
    <g id="conversation-mark" fill="#fbbf24" transform="translate(0,824) scale(.1,-.1)">
      <path d="M4500 8234 c-800 -51 -1376 -164 -1985 -389 -1292 -478 -2181 -1310 -2429 -2275 -191 -747 11 -1508 575 -2165 229 -266 564 -548 892 -749 l78 -48 -27 -47 c-53 -93 -194 -298 -267 -389 -258 -321 -567 -618 -1080 -1037 -145 -119 -227 -193 -241 -218 -21 -37 -21 -38 -2 -52 28 -21 157 -19 291 4 722 125 1656 487 2652 1028 l183 99 142 -32 c290 -64 551 -105 898 -141 140 -14 266 -18 625 -18 459 0 567 6 885 45 1514 191 2784 844 3454 1778 229 318 369 644 437 1010 26 138 37 479 20 619 -87 722 -504 1380 -1211 1909 -780 584 -1794 940 -2985 1049 -158 15 -774 28 -905 19z"/>
      <path d="M10106 4738 c-73 -597 -285 -1093 -678 -1586 -113 -141 -384 -417 -523 -533 -502 -420 -1091 -739 -1783 -969 -111 -37 -205 -69 -208 -72 -6 -7 198 -188 281 -248 289 -212 605 -371 968 -489 811 -263 1774 -277 2593 -38 l81 24 161 -98 c355 -217 731 -410 1032 -531 215 -87 533 -179 666 -194 63 -6 104 5 104 29 0 24 -46 75 -121 138 -226 187 -311 264 -441 398 -164 169 -258 293 -328 436 -46 94 -90 231 -90 281 0 15 26 42 93 95 50 40 144 125 207 188 427 428 601 941 495 1455 -111 535 -535 1025 -1180 1362 -367 192 -826 335 -1276 398 l-47 7 -6 -53z"/>
