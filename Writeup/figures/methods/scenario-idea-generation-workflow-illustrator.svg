<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1480" height="650" viewBox="120 130 1480 650">
  <title>Scenario-idea generation workflow</title>
  <desc>Scenario generation produces and verifies a novel scenario idea, then passes it to a separate continuing API author that returns a validated API contract.</desc>
  <metadata>Illustrator-compatible, self-contained SVG. All icons are native vector paths; text remains editable.</metadata>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#fbbf24"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#16a34a"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#7c3aed"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#dc2626"/></marker>
    <style>
      text { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; }
      .section { font-size: 12px; font-weight: 800; letter-spacing: .14em; }
      .stage-title { font-size: 27px; font-weight: 750; }
      .agent-title { font-size: 23px; font-weight: 750; }
      .arrow-label { font-size: 13px; font-weight: 700; }
      .tiny { font-size: 12px; font-weight: 650; }
    </style>

    <!-- Native copies of the project marks keep the SVG self-contained. -->
    <g id="llm-agent-mark">
