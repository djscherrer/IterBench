# Intentionally invalid workload spec for validation tests / manual checks.
# backend.replicas must be >= 1 — this should fail static validation.
apiVersion: baxbench.dev/v1alpha1
kind: K8sWorkloadSpec
metadata:
  iteration_id: iteration-invalid
namespace: baxbench-iteration-invalid
labels:
  baxbench.dev/scenario: demo
backend:
  image: example.invalid/app:tag
  replicas: 0
  port: 5001
  resources:
    cpu_request: "250m"
    cpu_limit: "1"
    memory_request: "256Mi"
    memory_limit: "512Mi"
database:
  enabled: true
  image: postgres:17-alpine
  replicas: 1
  max_connections: 100
